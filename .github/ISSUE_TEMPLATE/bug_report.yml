name: Bug report
description: Report something that does not work as documented.
labels: [bug]
body:
  - type: input
    id: theway-version
    attributes:
      label: theway version
      description: The installed release (`~/.theway/bin/theway`), or the commit.
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: For example macOS 15.5 or Ubuntu 24.04.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output or error messages.
      render: shell
