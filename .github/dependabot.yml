version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: bun
    directories: ["/", "/site"]
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]
    ignore:
      # Types follow the minimum supported Node.js (engines: >=22.12).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
