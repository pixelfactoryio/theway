# theway configuration
# A project can override any key in <home>/<project>/config.yaml; theway config <project> prints the result.

# Standards: standards.<key>.enabled switches any standard, key = file stem with - as _ (shipped opt-in ones default false, your own standards true)
standards:
  # Architecture philosophy (simplicity, security, pragmatic technology)
  core_principles:
    enabled: false
  # SRE operational excellence (reliability, observability, automation)
  sre:
    enabled: false
  # Frontend, API and backend standards with web performance targets
  web_development:
    enabled: false
  # Testing, deployment, monitoring and security expectations
  quality:
    enabled: false

# Engineering - spec review for /theway:engineering and /theway:engineering-light (absent or invalid key means the default)
engineering:
  # Maximum review rounds per scaffold; 0 skips the review
  review_rounds: 1
  # Model of the critic agents (two in /theway:engineering, one in /theway:engineering-light): opus, sonnet or haiku (absent or invalid means the default)
  # Lower cost: sonnet
  models:
    critic: opus

# Workflow - defaults for /theway:workflow: a field a step of a workflow file leaves out takes its value here (absent or invalid key means the default)
# Models: opus, sonnet or haiku
workflow:
  defaults:
    # The implementer
    implement:
      model: opus
    # The local review before anything is pushed
    review:
      # Maximum review rounds; leave the review step out of a workflow to skip the review
      rounds: 1
      # One reviewer per lens, from <home>/<project>/lenses/<name>.md or <home>/lenses/<name>.md
      lenses: [conformance, correctness]
      # The reviewers, the triage agent and the fix check
      model: opus
      # The fix agent of each round
      fix_model: opus
    # The push, the PR and CI; leave the pr step out of a workflow to push nothing
    pr:
      # CI attempts to reach green, re-runs included
      ci_attempts: 2
      # The push/PR agent, CI polling and log fetching
      model: sonnet
      # The CI fix agent
      fix_model: opus
    # A custom agent step
    agent:
      model: sonnet
