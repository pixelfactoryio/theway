# theway configuration
# A project can override any key in <home>/projects/<key>/config.yaml; theway config prints the result.

# Standards: standards.<key>.enabled switches any standard, key = file stem with - as _ (shipped opt-in ones default false, your own standards true)
standards:
  # Architecture philosophy (simplicity, security, pragmatic technology)
  core_principles:
    enabled: false
  # SRE operational excellence (reliability, observability, automation)
  sre:
    enabled: false
  # Frontend, API and backend standards with web performance targets
  web_development:
    enabled: false
  # Testing, deployment, monitoring and security expectations
  quality:
    enabled: false
