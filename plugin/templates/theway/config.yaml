# theway configuration
# <home> is the theway home, the folder `theway path` prints

# Standards read by the commands; core_principles, sre, web_development and quality are opt-in and honor enabled, the others are always read
standards:
  interaction:
    enabled: true
    file: "<home>/data/standards/interaction.md"
    description: "Cross-cutting interaction conventions (exploration, reporting) for all commands"

  develop:
    enabled: true
    file: "<home>/data/standards/develop.md"
    description: "How a change is implemented and verified, shared by /theway:develop and /theway:develop-workflow"

  core_principles:
    enabled: false
    file: "<home>/data/standards/core-principles.md"
    description: "Opt-in: architecture philosophy (simplicity, security, pragmatic technology)"

  sre:
    enabled: false
    file: "<home>/data/standards/sre.md"
    description: "Opt-in: SRE operational excellence (reliability, observability, automation)"

  web_development:
    enabled: false
    file: "<home>/data/standards/web-development.md"
    description: "Opt-in: frontend, API and backend standards with web performance targets"

  quality:
    enabled: false
    file: "<home>/data/standards/quality.md"
    description: "Opt-in: testing, deployment, monitoring and security expectations"

  tamm_framework:
    enabled: true
    file: "<home>/data/standards/tamm-framework.md"
    description: "Time/Autonomy/Mastery/Machine hardpoint analysis framework"

# Engineering - spec review for /theway:engineering (absent or invalid key means the default)
engineering:
  # Maximum review rounds per scaffold; 0 skips the review
  review_rounds: 1
  # Model of the two critic agents: opus or sonnet (absent or invalid means the default)
  # Lower cost: sonnet
  models:
    critic: opus

# Develop Workflow - caps for /theway:develop-workflow (absent or invalid key means the default)
workflow:
  # Review rounds per change; 0 skips review and the fix check
  review_rounds: 1
  # CI attempts per change to reach green, re-runs included
  ci_attempts: 2
  # Push the branch, open the PR and drive CI after the local review; false stops at the reviewed local branch
  open_pr: true
  # Model per agent role: opus or sonnet (absent or invalid means the default)
  # Lower cost: implementer, fix and ci on sonnet, reviewer on opus
  models:
    implementer: opus
    # Adversarial reviewers and the fix check
    reviewer: opus
    fix: opus
    # CI polling and log fetching
    ci: sonnet
